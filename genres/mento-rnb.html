<h1>Mento / Jamaican R&B</h1>
<p class="dek">1950年代のジャマイカでは、Mentoのような土着音楽と、米国から届くR&BやJazzが同じ街で鳴っていました。そこにサウンドシステム文化が重なり、SKAが生まれる土台が整っていきます。</p>
<p>MentoはSKAそのものではありません。けれどリズム感、演奏文化、地域の音楽生活を考えると、SKA以前のジャマイカを知る重要な入口です。</p>
