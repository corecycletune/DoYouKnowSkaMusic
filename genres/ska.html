<h1>SKA</h1>
<p class="dek">SKAは1950年代末から60年代初頭のジャマイカで形になった音楽です。ギターやピアノのオフビート、強いホーン、速く跳ねるリズムが大きな特徴です。</p>
<p>The Skatalites、Prince Buster、Desmond Dekkerらの録音を聴くと、のちのRocksteadyやReggaeへ続く要素がすでに聞こえてきます。</p>
