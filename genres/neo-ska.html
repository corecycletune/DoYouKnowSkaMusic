<p class="eyebrow">SKA FAMILY</p><h1>Neo Ska / Ska Revival</h1>
<p class="dek">2 Tone以後もSKAは消えず、1980年代には英国以外の各地で新しいバンドとシーンが育っていきました。日本ではこの時期以降を広く「ネオスカ」と呼ぶことがあります。</p><p>ただし「Neo Ska」は世界共通で厳密に定義された一ジャンル名ではなく、2 Tone以後のSKAリバイバルを指す幅のある呼び方です。</p>
