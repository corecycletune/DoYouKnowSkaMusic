<p class="eyebrow">SKA FAMILY</p><h1>Modern Ska / New Tone</h1>
<p class="dek">Third Waveのブームが落ち着いたあともSKAのシーンは途切れていません。2010年代末以降、米国を中心に新しい世代のバンドが再び注目を集めています。</p><p>「Fourth Wave」や「New Tone」という呼び方もありますが、現在のSKA全体を一つの音で括る言葉ではありません。Trad寄り、Ska Punk、Pop、Hardcoreなど複数の流れが並行しています。</p>
